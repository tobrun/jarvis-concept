[project]
name = "jarvis"
version = "0.1.0"
description = "Bootstrap kit for Jarvis: a scheduled, guarded, self-measuring personal assistant on Claude Code"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastembed>=0.9",
    "holidays>=0.60",
    "numpy>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
markers = [
    "e2e: drives scripts/run.sh and replay end to end with a fake claude binary",
    "postgres: needs Postgres 17 binaries and pgvector (index backend postgres)",
]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

# Dead code check of the ship gauntlet: `uvx --from vulture==2.14 vulture`.
[tool.vulture]
paths = ["scripts", "tests"]
min_confidence = 60
# Used by a framework, not by name: a shlex attribute, the pytest module mark, a pytest fixture parameter.
ignore_names = ["whitespace_split", "pytestmark", "db_url"]

[tool.ruff.lint.isort]
# scripts/ modules import each other by bare name; `adapters` would otherwise sort as the adapters/ folder.
known-third-party = ["adapters"]
